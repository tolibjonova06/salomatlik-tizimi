<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;max-width:900px;margin:auto}
h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;max-width:900px;margin:auto}
nav button{white-space:nowrap}
main{max-width:900px;margin:auto;padding:8px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--ac2);border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat span{color:var(--mu);font-size:12px}
button,input,select{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
label{font-size:12px;color:var(--mu);display:block}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
.x{color:var(--wa);border:0;background:none;padding:2px 6px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mu{color:var(--mu);font-size:13px}.tip{background:var(--ac2);border-radius:10px;padding:8px 12px;margin:6px 0}
svg text{fill:var(--mu);font-size:10px}
</style>
</head>
<body>
<header><h1>🌿 Shaxsiy salomatlik, fitnes va boʻsh vaqt tizimi</h1>
<div><button onclick="th()">🌓</button> <button onclick="ex()">Eksport</button> <button onclick="document.getElementById('im').click()">Import</button><input id="im" type="file" accept=".json" hidden onchange="imp(this)"></div></header>
<nav id="nav"></nav>
<main id="v"></main>
<script>
var T=[["d","Bosh sahifa"],["h","Salomatlik"],["w","Mashqlar"],["l","Boʻsh vaqt"],["g","Maqsadlar"],["a","Farovonlik testi"],["k","Dataset tahlili"]];
var D={h:[],w:[],l:[],g:{steps:8000,sleep:8,water:2,workouts:3,leisure:3}};
try{var s=localStorage.getItem("shf");if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
var tab="d";

function $(i){return document.getElementById(i)}

function sum(a,k){return a.reduce(function(s,x){return s+(+x[k]||0)},0)}
function week(a){return a.filter(function(x){return x.date>=ago(6)})}
function avg(a,k){var b=a.filter(function(x){return x[k]!==""&&x[k]!=null});return b.length?sum(b,k)/b.length:0}

 var p=a.slice().sort(function(x,y){return x.date<y.date?-1:1}).slice(-14).filter(function(x){return x[k]!==""});

 var v=p.map(function(x){return +x[k]}),mn=Math.min.apply(0,v),mx=Math.max.apply(0,v);if(mx===mn)mx=mn+1;

function del(k,id){D[k]=D[k].filter(function(x){return x.id!==id});sv();R()}
function add(k,e){e.preventDefault();var o={id:Date.now()},fd=new FormData(e.target);fd.forEach(function(v,n){o[n]=v});if(!o.date)o.date=td();D[k].push(o);sv();R()}

 return {v:b,t:b<18.5?"Vazn yetarli emas":b<25?"Normal":b<30?"Ortiqcha vazn":"Semizlik"}}
function score(){
 var g=D.g,h=week(D.h),w=week(D.w),l=week(D.l);
 var p=[Math.min(1,avg(h,"steps")/g.steps),Math.min(1,avg(h,"sleep")/g.sleep),Math.min(1,avg(h,"water")/g.water),Math.min(1,w.length/g.workouts),Math.min(1,l.length/g.leisure)];
 return Math.round(p.reduce(function(a,b){return a+b},0)/5*100)}

 var h=week(D.h),t=[],g=D.g;
 if(!h.length)return ["Bugungi koʻrsatkichlaringizni kiriting — tahlil shundan boshlanadi."];

 if(avg(h,"water")&&avg(h,"water")<g.water)t.push("💧 Suv ichish maqsaddan kam. Yonida shisha suv olib yuring.");
 if(week(D.w).length<g.workouts)t.push("🏋️ Bu hafta mashqlar maqsaddan kam. Qisqa 20 daqiqalik mashq ham foydali.");
